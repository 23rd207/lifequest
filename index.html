<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ライフクエスト">
<meta name="theme-color" content="#0b0e2b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-512.png">
<title>ライフクエスト</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=M+PLUS+1p:wght@400;700&display=swap">
<style>
html{padding-top:env(safe-area-inset-top,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: one-column handheld RPG — stacked "windows" (white-bordered boxes on night sky), fixed command bar at the bottom */
:root{
  --sky:#0b0e2b;
  --win:#131a52;
  --win-2:#1b2366;
  --ink:#f3f1ff;
  --dim:#a3a8dc;
  --gold:#ffd45e;
  --danger:#ff7b86;
  --c-body:#ff8a6b;
  --c-int:#6fbcff;
  --c-mind:#bb93ff;
  --c-bond:#6fe0a6;
  --f-pixel:"DotGothic16","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --f-body:"M PLUS 1p","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{
  background:var(--sky);
  background-image:
    radial-gradient(1px 1px at 12% 18%, #ffffff55 50%, transparent 51%),
    radial-gradient(1px 1px at 78% 9%, #ffffff44 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 55% 32%, #ffffff33 50%, transparent 51%),
    radial-gradient(1px 1px at 30% 64%, #ffffff33 50%, transparent 51%),
    radial-gradient(1px 1px at 90% 72%, #ffffff44 50%, transparent 51%);
  background-attachment:fixed;
  color:var(--ink);
  font-family:var(--f-pixel);
  font-size:15px;
  line-height:1.6;
  -webkit-tap-highlight-color:transparent;
}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
.wrap{
  max-width:560px;margin:0 auto;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:14px calc(96px + env(safe-area-inset-bottom, 0px));
  display:flex;flex-direction:column;gap:14px;
}
.win{
  background:var(--win);
  border:3px solid var(--ink);
  border-radius:8px;
  box-shadow:0 0 0 3px var(--sky), 0 6px 0 3px #00000055;
  padding:12px 14px;
  min-width:0;
}
.win-title{
  display:flex;justify-content:space-between;align-items:baseline;gap:8px;
  font-size:13px;color:var(--dim);letter-spacing:.08em;margin:0 0 8px;font-weight:400;
}
.win-title b{color:var(--ink);font-weight:400;font-size:16px;letter-spacing:.04em}
.mono{font-variant-numeric:tabular-nums}
.sprite{image-rendering:pixelated;image-rendering:crisp-edges;display:block;flex:none}
.ranks{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.ranks li{background:#070a22;border:2px solid transparent;border-radius:5px;padding:8px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;min-width:0}
.ranks li.now{border-color:var(--gold)}
.ranks .rn{font-family:var(--f-body);font-size:12px;font-weight:700;line-height:1.3;overflow-wrap:anywhere}
.ranks .rl{font-size:11px;color:var(--dim)}
.ranks li.lock .rn{color:var(--dim)}

/* hero status */
.hero{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:end}
.hero-name{font-size:22px;line-height:1.2;overflow-wrap:anywhere}
.hero-title{font-size:13px;color:var(--gold)}
.hero-lv{font-size:13px;color:var(--dim);text-align:right}
.hero-lv span{font-size:28px;color:var(--ink);line-height:1}
.bar{height:10px;border:2px solid var(--ink);border-radius:3px;background:#070a22;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--gold);transition:width .5s steps(8)}
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--dim);margin-top:8px}
.meta strong{color:var(--ink);font-weight:400}
.meta .g{color:var(--gold)}
.clock{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--dim);border-top:2px dashed #ffffff22;margin-top:10px;padding-top:8px}
.clock b{color:var(--ink);font-weight:400}

/* quests */
.qlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.q{
  display:grid;grid-template-columns:22px 1fr auto;gap:2px 8px;align-items:center;
  padding:10px 4px;border-bottom:2px dotted #ffffff1c;
}
.q:last-child{border-bottom:0}
.cur{color:var(--gold);visibility:hidden;font-size:13px}
.q:hover .cur,.q:focus-within .cur{visibility:visible}
.q-t{font-family:var(--f-body);font-size:15px;font-weight:700;line-height:1.4;min-width:0;overflow-wrap:anywhere}
.q-sub{grid-column:2/3;display:flex;flex-wrap:wrap;gap:4px 8px;font-size:12px;color:var(--dim)}
.chip{border:1px solid currentColor;border-radius:3px;padding:0 5px;line-height:1.5}
.st-body{color:var(--c-body)}.st-int{color:var(--c-int)}.st-mind{color:var(--c-mind)}.st-bond{color:var(--c-bond)}
.rew{color:var(--gold)}
.btn{
  background:var(--win-2);border:2px solid var(--ink);border-radius:5px;
  padding:6px 12px;min-height:40px;cursor:pointer;white-space:nowrap;
  box-shadow:0 3px 0 #00000080;
}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #00000080}
.btn:focus-visible,.tab:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn.go{background:var(--gold);color:#221a00;border-color:var(--gold)}
.btn.ghost{background:transparent;border-color:var(--dim);color:var(--dim)}
.btn.small{min-height:32px;padding:3px 9px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:default;transform:none}
.q.done .q-t{color:var(--dim);text-decoration:line-through;text-decoration-thickness:2px}
.stamp{color:var(--gold);border:2px solid var(--gold);border-radius:4px;padding:2px 8px;font-size:13px;transform:rotate(-6deg);display:inline-block;background:none;cursor:pointer}
.q.locked .q-t,.q.expired .q-t{color:var(--dim)}
.wait{font-size:12px;color:var(--dim);text-align:right;line-height:1.3}
.expired-tag{font-size:12px;color:var(--danger)}

.progress-line{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--dim);margin-bottom:6px}
.progress-line .bar{flex:1}
.bonus{font-size:13px;color:var(--dim);margin-top:6px}
.bonus.got{color:var(--gold)}
.empty{font-family:var(--f-body);font-size:13px;color:var(--dim);padding:8px 4px}
.note{font-family:var(--f-body);font-size:12px;color:var(--dim);line-height:1.6}

/* forms */
.form{display:grid;gap:8px;margin-top:10px;padding-top:10px;border-top:2px dashed #ffffff22}
.form label{font-size:12px;color:var(--dim);display:grid;gap:3px}
.form input,.form select{
  background:#070a22;border:2px solid var(--dim);border-radius:4px;padding:8px 10px;width:100%;min-width:0;
  font-family:var(--f-body);font-size:16px;
}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1 1 120px;min-width:0}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1 1 auto;min-height:36px;padding:3px 8px;font-size:13px;background:#070a22;border:2px solid #ffffff33;border-radius:4px;cursor:pointer}
.seg button[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}

/* stats */
.stats{display:grid;gap:12px}
.stat{display:grid;grid-template-columns:3.2em 1fr auto;gap:10px;align-items:center}
.stat .bar>i{transition:width .5s steps(8)}
.stat-n{font-size:16px}
.stat-v{font-size:13px;color:var(--dim);text-align:right;min-width:5.5em}
.log{list-style:none;margin:0;padding:0;font-size:13px}
.log li{display:flex;justify-content:space-between;gap:10px;padding:6px 2px;border-bottom:1px dotted #ffffff1c}
.log li span:first-child{font-family:var(--f-body);min-width:0;overflow-wrap:anywhere}
.log time{color:var(--dim);white-space:nowrap}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.kv div{background:#070a22;border-radius:4px;padding:8px 10px;font-size:12px;color:var(--dim)}
.kv b{display:block;font-size:20px;color:var(--ink);font-weight:400}

/* tab bar */
.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:5;
  background:var(--win);border-top:3px solid var(--ink);
  padding-top:6px;
  padding-bottom:calc(6px + env(safe-area-inset-bottom, 0px));
  padding-left:max(10px, env(safe-area-inset-left, 0px));
  padding-right:max(10px, env(safe-area-inset-right, 0px));
}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
/* calendar */
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.cal-head b{font-size:18px;font-weight:400}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.cal .wd{font-size:11px;color:var(--dim);text-align:center;padding-bottom:2px}
.cal .wd.sun{color:var(--danger)}.cal .wd.sat{color:var(--c-int)}
.day{background:#070a22;border:2px solid transparent;border-radius:4px;min-height:52px;padding:3px 2px 4px;
  display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;color:var(--ink);font-size:13px;min-width:0}
.day.out{opacity:.35}
.day.today{border-color:var(--dim)}
.day[aria-pressed="true"]{border-color:var(--gold)}
.day .n{line-height:1.2}
.day .clr{font-size:10px;color:var(--gold);line-height:1}
.day .dots{display:flex;gap:2px;flex-wrap:wrap;justify-content:center}
.day .dot{width:5px;height:5px;border-radius:1px;background:var(--c-int)}
.day .dot.shift{background:var(--gold)}
.day .dot.pay{background:var(--c-bond)}
.day.sun .n{color:var(--danger)}.day.sat .n{color:var(--c-int)}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11px;color:var(--dim);margin-top:8px}
.legend i{display:inline-block;width:7px;height:7px;border-radius:1px;margin-right:4px;vertical-align:middle}
.evlist{list-style:none;margin:0;padding:0}
.evlist li{display:grid;grid-template-columns:5.5em 1fr;gap:8px;padding:7px 2px;border-bottom:1px dotted #ffffff1c;font-size:13px}
.evlist li span:last-child{font-family:var(--f-body);min-width:0;overflow-wrap:anywhere}
.evlist .t{color:var(--dim)}
.evlist li.evli{display:block;padding:0}
.evlist li.soon-day{display:block;padding:10px 2px 2px;border-bottom:0;color:var(--gold);font-size:13px}
.evlist .pay{color:var(--c-bond)}
.evbtn{all:unset;box-sizing:border-box;display:grid;grid-template-columns:5.5em 1fr;gap:8px;width:100%;padding:9px 2px;cursor:pointer;font-size:13px}
.evbtn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.evbtn span:last-child{font-family:var(--f-body);min-width:0;overflow-wrap:anywhere}.evlist .shift{color:var(--gold)}
.tab{background:none;border:0;padding:8px 2px;min-height:48px;cursor:pointer;color:var(--dim);font-size:14px;border-radius:5px;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);background:var(--win-2)}
.tab[aria-selected="true"]::before{content:"▶ ";color:var(--gold)}

/* message window */
.msg{
  position:fixed;left:0;right:0;z-index:6;
  bottom:calc(76px + env(safe-area-inset-bottom, 0px));
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  pointer-events:none;
}
.msg .win{max-width:560px;margin:0 auto;font-size:15px;line-height:1.7;pointer-events:auto}
.msg .win::after{content:"▼";display:block;text-align:right;color:var(--gold);font-size:11px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}

.overlay{position:fixed;inset:0;z-index:10;background:#05071acc;display:grid;place-items:center;
  padding-left:max(20px, env(safe-area-inset-left, 0px));padding-right:max(20px, env(safe-area-inset-right, 0px))}
.overlay .win{width:100%;max-width:420px;text-align:center;padding:22px 18px}
.big{font-size:26px;color:var(--gold);margin:6px 0 4px;line-height:1.3}
.lvl-anim{animation:pop .5s steps(5)}
@keyframes pop{from{transform:scale(.6)}to{transform:scale(1)}}
.confirm{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head>
<body>
<main class="wrap" id="app"></main>

<nav class="tabs" aria-label="メニュー">
  <div class="tabs-in" role="tablist">
    <button class="tab" role="tab" id="tab-quest" data-tab="quest">クエスト</button>
    <button class="tab" role="tab" id="tab-status" data-tab="status">ステータス</button>
    <button class="tab" role="tab" id="tab-cal" data-tab="cal">こよみ</button>
    <button class="tab" role="tab" id="tab-shop" data-tab="shop">ショップ</button>
  </div>
</nav>
<div class="msg" id="msg" hidden><div class="win" id="msg-text"></div></div>
<div class="overlay" id="overlay" hidden></div>

/* ---------- time helpers ---------- */
const pad = n => String(n).padStart(2,"0");
function ymd(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function gameDate(now){return new Date(now.getTime() - DAY_START*3600e3)}
function today(now=new Date()){return ymd(gameDate(now))}
function yesterday(now=new Date()){const d=gameDate(now);d.setDate(d.getDate()-1);return ymd(d)}
function weekKey(now=new Date()){const d=gameDate(now);const w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return ymd(d)}
// hour on the game clock: 4..27 (翌3時台 = 27)
function gameHour(now){const h=now.getHours()+now.getMinutes()/60;return h<DAY_START?h+24:h}
function untilReset(now){
  const n=new Date(now);n.setHours(DAY_START,0,0,0);if(n<=now)n.setDate(n.getDate()+1);
  return n-now;
}
// 繰り返しの単位ごとの「期間キー」。同じキーの間は達成済みのまま
function periodKey(r,ds){
  if(r==="weekly"){const[y,m,d]=ds.split("-").map(Number);const dt=new Date(y,m-1,d);dt.setDate(dt.getDate()-(dt.getDay()+6)%7);return ymd(dt)}
  if(r==="monthly")return ds.slice(0,7);
  if(r==="once")return"once";
  return ds;
}
const REPEAT = {
  daily:{n:"毎日",chip:"毎日"},
  weekly:{n:"毎週",chip:"毎週 ・ 月曜リセット"},
  monthly:{n:"毎月",chip:"毎月 ・ 1日リセット"},
  once:{n:"1回だけ",chip:"1回"}
};
function isDoneNow(q){return !!q.doneOn&&periodKey(q.r,q.doneOn)===periodKey(q.r,today())}
function fmtDur(ms){const s=Math.max(0,Math.floor(ms/1000));return Math.floor(s/3600)+":"+pad(Math.floor(s%3600/60))+":"+pad(s%60)}
function fmtHM(ms){const m=Math.max(0,Math.ceil(ms/60000));const h=Math.floor(m/60);return h?h+"時間"+(m%60)+"分":m+"分"}
function phase(now){const h=now.getHours();
  if(h>=5&&h<11)return"朝";if(h>=11&&h<16)return"昼";if(h>=16&&h<19)return"夕方";return"夜"}

/* ---------- rng ---------- */
function hash(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function pick(arr,n,r){const a=arr.slice();const out=[];while(out.length<n&&a.length){out.push(a.splice(Math.floor(r()*a.length),1)[0])}return out}
function dailyFor(date){
  const r=rng(hash("lq"+date));
  const by=w=>POOL.filter(q=>q.w===w);
  return [...pick(by("morning"),1,r),...pick(by("any"),3,r),...pick(by("night"),1,r)].map(q=>q.id);
}

      {id:"c2",t:"(例)部屋の大掃除",s:"mind",d:3,r:"once",doneOn:"",got:null}

      {id:"r3",t:"(例)ちょっといいランチ",c:200}
    ],
    log:[]
  };
}
function normalize(s){
  const f=fresh();
  if(!s||typeof s!=="object")return f;
  const o=Object.assign(f,s);
  o.stats=Object.assign(fresh().stats,s.stats||{});
  o.daily=Object.assign(fresh().daily,s.daily||{});
  o.events=Object.assign(fresh().events,s.events||{});
  o.rems=Object.assign(fresh().rems,s.rems||{});
  if(!o.hist||typeof o.hist!=="object")o.hist={};
  if(!o.multi||typeof o.multi!=="object")o.multi={};
  o.wardrobe=Object.assign({owned:{},wear:""},s.wardrobe||{});if(!o.wardrobe.owned||typeof o.wardrobe.owned!=="object")o.wardrobe.owned={};
  o.week=Object.assign(fresh().week,s.week||{});
  o.dayCount=Object.assign(fresh().dayCount,s.dayCount||{});
  if(!Array.isArray(o.custom))o.custom=[];
  if(!Array.isArray(o.rewards))o.rewards=[];
  if(!Array.isArray(o.log))o.log=[];
  // editedAt = 最後にプレイヤーが操作した時刻。空のデータは0なので、進行中のデータを上書きしない
  if(typeof s.editedAt!=="number"){
    const played=!!(s.name||s.xp||(Array.isArray(s.log)&&s.log.length));
    o.editedAt=played?(s.updatedAt||1):0;
  }
  return o;
}

function b64(str){return btoa(unescape(encodeURIComponent(str)))}

async function copyText(text,okLines){

function rollover(now=new Date()){
  const t=today(now);let changed=false;
  if(state.daily.date!==t){state.daily={date:t,ids:dailyFor(t),done:{},bonus:false};changed=true}
  if(state.events.date!==t){state.events={date:t,done:{}};changed=true}
  if(state.rems.date!==t){state.rems={date:t,done:{}};changed=true;
    for(const k in state.multi){if((state.multi[k].end||0)<Date.now()-30*864e5)delete state.multi[k]}}
  if(state.dayCount.date!==t){state.dayCount={date:t,n:0};changed=true}
  const wk=weekKey(now);
  if(state.week.key!==wk){state.week={key:wk,n:0,bonus:false};changed=true}
  if(state.streak&&state.streakDay!==t&&state.streakDay!==yesterday(now)){state.streak=0;changed=true}
  return changed;
}

/* ---------- level ---------- */
const need = l => 40 + l*20;
function levelInfo(xp){let l=1,x=xp;while(l<MAX_LV&&x>=need(l)){x-=need(l);l++}
  if(l>=MAX_LV)return{lv:MAX_LV,cur:need(MAX_LV),need:need(MAX_LV),max:true};
  return{lv:l,cur:x,need:need(l)}}
function rankIndex(lv){let i=0;TITLES.forEach(([l],k)=>{if(lv>=l)i=k});return i}
// ドット絵を画像にして使い回す(locked = まだなっていない階級のシルエット)
const spriteCache={};
// 見た目のキー:"r3" = 階級3の姿、"c:ninja" = きせかえ
function spriteRows(key){
  if(key[0]==="c"){const c=COSTUMES.find(x=>x[0]===key.slice(2));return c?c[3]:SPRITES[0]}
  return SPRITES[Number(key.slice(1))]||SPRITES[0];
}
function spriteURL(i,locked){
  const key=(typeof i==="number"?"r"+i:i)+(locked?"#L":"");
  if(spriteCache[key])return spriteCache[key];
  try{
    const c=document.createElement("canvas");c.width=c.height=16;const g=c.getContext("2d");
    spriteRows(key.replace("#L","")).forEach((row,y)=>[...row].forEach((ch,x)=>{
      if(ch===".")return;g.fillStyle=locked?"#2a3070":SPRITE_PAL[ch];g.fillRect(x,y,1,1)}));
    return spriteCache[key]=c.toDataURL();
  }catch(e){return""}
}
// いま着ている見た目
function lookKey(){
  const w=state.wardrobe.wear||"",ri=rankIndex(levelInfo(state.xp).lv);
  if(w.startsWith("c:")&&state.wardrobe.owned[w.slice(2)])return w;
  if(/^r\d+$/.test(w)&&Number(w.slice(1))<=ri)return w;
  return "r"+ri;
}
function lookName(key){
  if(key.startsWith("c:")){const c=COSTUMES.find(x=>x[0]===key.slice(2));return c?c[1]:""}
  return TITLES[Number(key.slice(1))][1];
}
function spriteImg(i,size,locked,label){
  const u=spriteURL(i,locked);
  return u?`<img class="sprite" src="${u}" width="${size}" height="${size}" alt="${esc(label||(typeof i==="number"?TITLES[i][1]:lookName(i)))}">`:"";
}
function titleFor(lv){let t=TITLES[0][1];for(const [l,n] of TITLES)if(lv>=l)t=n;return t}
const statLv = p => Math.floor(p/20)+1;

/* ---------- rewards ---------- */
function grant(xp,g,stat,label,sign=1){
  const before=levelInfo(state.xp).lv;
  state.xp=Math.max(0,state.xp+sign*xp);
  state.gold=Math.max(0,state.gold+sign*g);
  if(stat)state.stats[stat]=Math.max(0,state.stats[stat]+sign*Math.round(xp/5));
  if(sign>0)state.log.unshift({t:label,xp,g,ts:Date.now()});
  else state.log.unshift({t:"取り消し:"+label,xp:-xp,g:-g,ts:Date.now()});
  state.log=state.log.slice(0,40);
  const after=levelInfo(state.xp).lv;
  return after>before?after:0;
}
function countDone(sign,sameDay=true){
  state.totalDone=Math.max(0,state.totalDone+sign);
  if(sameDay)state.dayCount.n=Math.max(0,state.dayCount.n+sign);
  state.week.n=Math.max(0,state.week.n+sign);
  const t=today();
  if(sameDay){state.hist[t]=Math.max(0,(state.hist[t]||0)+sign);if(!state.hist[t])delete state.hist[t]}
  if(sign>0&&state.dayCount.n>=3&&state.streakDay!==t){
    state.streak=(state.streakDay===yesterday())?state.streak+1:1;
    state.streakDay=t;
    return true;
  }
  return false;
}

function multiDay(e,onDs){
  const s0=parseYmd(ymd(new Date(e.start))),last=new Date((e.end||e.start)-1),l0=parseYmd(ymd(last));
  const total=Math.round((l0-s0)/864e5)+1;

  const nth=onDs?Math.round((parseYmd(onDs)-s0)/864e5)+1:0;
  return {end:md(l0)+(e.allDay?"":" "+hm(e.end))+"まで",nth:nth>=1&&nth<=total?nth:0,total};
}

function questStateFor(q,now){

    if(!q.allDay&&now.getTime()<q.start){cls+=" locked";right=`<div class="wait">開始まで<br><span class="mono">${fmtHM(q.start-now.getTime())}</span></div>`}
    else right=`<button class="btn go" data-do="event:${q.id}">達成</button>`;
  }else{
    right=`<button class="btn go" data-do="custom:${q.id}">達成</button>`;
  }
  const when = kind==="daily" ? `<span class="chip">${q.to?WINDOWS[q.w].n.replace(/〜.*$/,"〜"+(q.to>=24?q.to-24:q.to)+"時"):WINDOWS[q.w].n}</span>`
    : kind==="event" ? `<span class="chip">${multiDay(q)?(q.allDay?"終日 ":hm(q.start)+" ")+multiTxt(q,today()):(q.allDay?"終日":hm(q.start)+"〜"+hm(q.end))}</span>${q.shift?`<span class="chip rew">シフト</span>`:""}${q.days?`<span class="chip">達成 ${((state.multi[q.mkey]||{}).days||[]).length}/${q.days}日</span>`:""}`
    : kind==="rem" ? `${q.overdue&&!done?`<span class="chip expired-tag">期限切れ</span>`:`<span class="chip">${remDueLabel(q)}</span>`}${q.list?`<span>${esc(q.list)}</span>`:""}`
    : `<span class="chip">${(REPEAT[q.r]||REPEAT.daily).chip}</span>`;
  const del = kind==="custom" ? `<button class="btn ghost small" data-del="${q.id}" aria-label="${esc(q.t)} を削除" style="margin-left:auto">削除</button>`:"";
  return `<li class="${cls}"><span class="cur" aria-hidden="true">▶</span><span class="q-t">${esc(q.t)}</span>${right}
    <div class="q-sub">${when}<span class="st-${q.s}">${S.n}</span><span>${D.n}</span><span class="rew">+${D.xp}EXP ${D.g}G</span>${extra}${del}</div></li>`;
}

/* ---------- こよみ(カレンダー) ---------- */
function parseYmd(ds){const[y,m,d]=ds.split("-").map(Number);return new Date(y,m-1,d)}
function eventsOn(ds){
  const list=(MONTH||[]).concat(pendingEvents);
  const day0=parseYmd(ds).getTime(),day1=day0+864e5;
  return list.filter(e=>e.start<day1&&(e.allDay?e.end>day0:(e.end>day0||e.start>=day0)))
    .filter(e=>e.allDay||e.start>=day0||e.end>day0)
    .sort((a,b)=>(a.allDay?0:1)-(b.allDay?0:1)||a.start-b.start);
}
function isShift(e){return SHIFT_RE.test(e.title||"")||SHIFT_RE.test(e.cal||"")}
function calTab(now){
  const t=today(now);
  if(!ui.calMonth)ui.calMonth=t.slice(0,7);
  if(!ui.calSel)ui.calSel=ymd(now);
  const [Y,M]=ui.calMonth.split("-").map(Number);
  ensureMonth(ui.calMonth);
  const loading=IN_WIDGET_APP&&MONTH&&!monthLoaded(ui.calMonth);
  const first=new Date(Y,M-1,1);
  const startOffset=(first.getDay()+6)%7;
  const gridStart=new Date(Y,M-1,1-startOffset);
  const cells=[];
  for(let i=0;i<42;i++){
    const d=new Date(gridStart.getFullYear(),gridStart.getMonth(),gridStart.getDate()+i);
    if(i>=35&&d.getMonth()!==M-1)break;
    const ds=ymd(d),evs=eventsOn(ds),clr=state.hist[ds]||0,payDue=payItems().some(p=>p.due&&ymd(new Date(p.due))===ds);
    const cls=["day",d.getMonth()!==M-1?"out":"",ds===ymd(now)?"today":"",d.getDay()===0?"sun":d.getDay()===6?"sat":""].filter(Boolean).join(" ");
    cells.push(`<button class="${cls}" data-day="${ds}" aria-pressed="${ds===ui.calSel}" aria-label="${d.getMonth()+1}月${d.getDate()}日 予定${evs.length}件 達成${clr}件">
      <span class="n mono">${d.getDate()}</span>${clr?`<span class="clr mono">★${clr}</span>`:""}
      <span class="dots">${evs.slice(0,4).map(e=>`<i class="dot ${isShift(e)?"shift":""}"></i>`).join("")}${payDue?`<i class="dot pay"></i>`:""}</span></button>`);
  }
  const sel=ui.calSel, sd=parseYmd(sel), evs=eventsOn(sel), clr=state.hist[sel]||0;
  const canAdd=IN_WIDGET_APP;
  return `<section class="win" aria-labelledby="h-cal">
    <div class="cal-head"><button class="btn small" data-calnav="-1" aria-label="前の月">◀</button><b id="h-cal" class="mono">${Y}年 ${M}月${loading?` <small style="font-size:12px;color:var(--dim)">読み込み中…</small>`:""}</b><button class="btn small" data-calnav="1" aria-label="次の月">▶</button></div>
    <div class="cal">${["月","火","水","木","金","土","日"].map((w,i)=>`<span class="wd ${i===6?"sun":i===5?"sat":""}">${w}</span>`).join("")}${cells.join("")}</div>
    <div class="legend"><span><i style="background:var(--gold)"></i>★ 達成したクエスト数</span><span><i style="background:var(--c-int)"></i>予定</span><span><i style="background:var(--gold)"></i>シフト</span>${PAYS?`<span><i style="background:var(--c-bond)"></i>支払い</span>`:""}</div>
    ${MONTH?"":`<p class="note" style="margin:8px 0 0">${IN_WIDGET_APP?"カレンダーを読めませんでした。iPhoneの「設定」→「Scriptable」→「カレンダー」を「フルアクセス」にしてください。":"iPhoneのカレンダーの予定は、ウィジェットから開いたときに表示されます。"}</p>`}
  </section>
  <section class="win" aria-labelledby="h-day">
    <h2 class="win-title" id="h-day"><b>${sd.getMonth()+1}月${sd.getDate()}日(${WD[sd.getDay()]})</b><span>${clr?"★ 達成 "+clr+"件":""}</span></h2>
    ${evs.length?`<ul class="evlist">${evs.map(e=>{
        const canEdit=canAdd&&!e.pending&&e.k&&e.editable!==false;
        const body=`<span class="mono ${isShift(e)?"shift":"t"}">${e.allDay?"終日":hm(e.start)+"〜"}</span><span>${esc(e.title||"予定")}${multiDay(e)?` <small style="color:var(--gold)">${multiTxt(e,sel)}</small>`:""}${e.pending?` <small style="color:var(--dim)">(追加中)</small>`:""}${canAdd&&!e.pending&&e.editable===false?` <small style="color:var(--dim)">(このカレンダーは編集できません)</small>`:""}${canEdit?` <small style="color:var(--dim)">✎</small>`:""}</span>`;
        if(ui.editEv&&ui.editEv===e.k)return `<li class="evli">${eventForm(sel,e)}</li>`;
        return canEdit?`<li class="evli"><button class="evbtn" data-evedit="${esc(e.k)}" aria-label="${esc(e.title||"予定")} を編集">${body}</button></li>`:`<li>${body}</li>`;
      }).join("")}</ul>`
      :`<div class="empty">この日の予定はありません。</div>`}
    ${(()=>{const ps=payItems().filter(p=>p.due&&ymd(new Date(p.due))===sel);return ps.length?`<p class="note" style="margin:6px 0 0;color:var(--c-bond)">この日の支払い:${ps.map(p=>esc(p.title)+(p.amount?" "+yen(p.amount):"")).join("、")}</p>`:""})()}
    ${canAdd?(ui.addEvent?eventForm(sel):`<div style="margin-top:8px"><button class="btn" id="open-ev">＋ この日に予定を追加</button></div>`)
      :`<p class="note" style="margin:8px 0 0">予定の追加は、ウィジェットから開いたゲームでできます。</p>`}
  </section>${paySection()}`;
}
function eventForm(ds,ev){
  const t2=ms=>{const d=new Date(ms);return pad(d.getHours())+":"+pad(d.getMinutes())};
  const date=ev?ymd(new Date(ev.start)):ds;
  return `<form class="form" id="ev-form" ${ev?'style="margin:0;border:0;padding:6px 0"':""}>
    <label for="ev-title">予定の名前<input id="ev-title" maxlength="60" placeholder="例:バイト / 歯医者" value="${ev?esc(ev.title||""):""}" required></label>
    <label for="ev-date">日付<input id="ev-date" type="date" value="${date}" required></label>
    <label>時間${`<div class="seg"><button type="button" data-seg="evAllDay" data-v="0" aria-pressed="${!ui.evAllDay}">時間を決める</button><button type="button" data-seg="evAllDay" data-v="1" aria-pressed="${!!ui.evAllDay}">終日</button></div>`}</label>
    ${ui.evAllDay?"":`<div class="row"><label for="ev-start">開始<input id="ev-start" type="time" value="${ev&&!ev.allDay?t2(ev.start):"10:00"}" required></label><label for="ev-end">終了<input id="ev-end" type="time" value="${ev&&!ev.allDay?t2(ev.end):"11:00"}" required></label></div>`}
    ${EV_CALS.length?`<label for="ev-cal">カレンダー<select id="ev-cal">${(ev&&ev.cal&&!EV_CALS.includes(ev.cal)?[ev.cal]:[]).concat(EV_CALS).map(c=>`<option ${(ev?ev.cal===c:c===(ui.lastCal||EV_CALS[0]))?"selected":""}>${esc(c)}</option>`).join("")}</select></label>`
      :(ev?`<p class="note" style="margin:0">カレンダー:${esc(ev.cal||"")}</p>`:`<p class="note" style="margin:0">iPhoneの標準のカレンダーに追加されます。</p>`)}
    <div class="row"><button class="btn ghost" type="button" id="cancel-ev">やめる</button><button class="btn go" type="submit">${ev?"保存する":"追加する"}</button></div>
    ${ev?(ui.delConfirm?`<div class="row"><button class="btn" type="button" id="del-ev-yes" style="border-color:var(--danger);color:var(--danger)">本当に削除する</button></div>`
      :`<div class="row"><button class="btn ghost small" type="button" id="del-ev">この予定を削除</button></div>`):""}
  </form>`;
}

function render(){
  const now=new Date();
  if(rollover(now))save(false);
  app.innerHTML=heroHTML(now)+(tab==="quest"?questTab(now):tab==="status"?statusTab():tab==="cal"?calTab(now):shopTab());
  document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.tab===tab)));
}

/* ---------- actions ---------- */
function complete(kind,id){
  let q,label;
  if(kind==="daily"){
    q=POOL.find(p=>p.id===id);if(!q||state.daily.done[id])return;
    if(questStateFor(q,new Date()).st!=="open")return;
  }else if(kind==="rem"){
    q=remQuests().find(r=>r.id===id);if(!q||state.rems.done[id])return;
  }else if(kind==="event"){
    q=eventQuests().find(e=>e.id===id);if(!q||state.events.done[id])return;
    if(!q.allDay&&Date.now()<q.start)return;
  }else{
    q=state.custom.find(c=>c.id===id);if(!q||isDoneNow(q))return;
  }
  const D=DIFF[q.d];label=q.t;
  const lines=[`「${q.t}」を 達成した！`,`${D.xp} の経験値と ${D.g}G を手に入れた。`];
  let lv=grant(D.xp,D.g,q.s,label);
  if(kind==="daily")state.daily.done[id]=true;else if(kind==="event"){state.events.done[id]=true;
    // 何日も続く予定:日ごとに記録して、全日程そろったらボーナス
    if(q.days){const m=state.multi[q.mkey]||(state.multi[q.mkey]={days:[],bonus:false,end:q.end});
      if(!m.days.includes(today()))m.days.push(today());
      if(!m.bonus&&m.days.length>=q.days){m.bonus=true;lv=grant(MULTI_BONUS.xp,MULTI_BONUS.g,q.s,"全日程達成:"+q.t)||lv;
        lines.push(`「${q.t}」全${q.days}日 達成！ ボーナス ${MULTI_BONUS.xp}EXP！`)}
      else lines.push(`全${q.days}日のうち ${m.days.length}日ぶん クリア。`)}}
  else if(kind==="rem"){state.rems.done[id]=true;pushOp({type:"rem",id,done:true})}else q.doneOn=today();
  if(countDone(1))lines.push(`連続 ${state.streak}日目！ よくがんばった。`);
  if(kind==="daily"&&!state.daily.bonus&&state.daily.ids.every(i=>state.daily.done[i])){
    state.daily.bonus=true;lv=grant(ALL_CLEAR.xp,ALL_CLEAR.g,null,"デイリー オールクリア")||lv;
    lines.push(`オールクリア！ ボーナス ${ALL_CLEAR.xp}EXP を手に入れた！`);
  }
  if(!state.week.bonus&&state.week.n>=WEEK_GOAL){
    state.week.bonus=true;lv=grant(WEEK_BONUS.xp,WEEK_BONUS.g,null,"ウィークリー達成")||lv;
    lines.push(`ウィークリー達成！ ${WEEK_BONUS.g}G を手に入れた！`);
  }
  save();render();
  if(lv)showLevelUp(lv);else say(lines);
}
function undo(kind,id){
  let q,sameDay=true;
  if(kind==="daily"){q=POOL.find(p=>p.id===id);if(!q||!state.daily.done[id])return;delete state.daily.done[id];
    if(state.daily.bonus){state.daily.bonus=false;grant(ALL_CLEAR.xp,ALL_CLEAR.g,null,"デイリー オールクリア",-1)}}
  else if(kind==="event"){q=eventQuests().find(e=>e.id===id);if(!q||!state.events.done[id])return;delete state.events.done[id];
    const m=q.days&&state.multi[q.mkey];
    if(m){m.days=m.days.filter(d=>d!==today());if(m.bonus&&m.days.length<q.days){m.bonus=false;grant(MULTI_BONUS.xp,MULTI_BONUS.g,q.s,"全日程達成:"+q.t,-1)}}}
  else if(kind==="rem"){q=remQuests().find(r=>r.id===id);if(!q||!state.rems.done[id])return;delete state.rems.done[id];pushOp({type:"rem",id,done:false})}
  else{q=state.custom.find(c=>c.id===id);if(!q||!isDoneNow(q))return;sameDay=q.doneOn===today();q.doneOn=""}
  const D=DIFF[q.d];grant(D.xp,D.g,q.s,q.t,-1);countDone(-1,sameDay);
  if(state.week.bonus&&state.week.n<WEEK_GOAL){state.week.bonus=false;grant(WEEK_BONUS.xp,WEEK_BONUS.g,null,"ウィークリー達成",-1)}
  save();render();say([`「${q.t}」の達成を 取り消した。`]);
}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);

app.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.do){const[k,i]=b.dataset.do.split(":");complete(k,i);return}
  if(b.dataset.undo){const[k,i]=b.dataset.undo.split(":");undo(k,i);return}
  if(b.dataset.paid!==undefined){const p=(PAYS||[]).find(x=>String(x.id)===b.dataset.paid);if(!p)return;
    paidNow.add(p.id);pushOp({type:"payDone",id:p.id});render();say([`「${p.title}」を 済にした。`]);return}
  if(b.dataset.evedit!==undefined){const e=(MONTH||[]).find(x=>x.k===b.dataset.evedit);if(!e)return;
    ui.editEv=e.k;ui.evAllDay=!!e.allDay;ui.addEvent=false;ui.delConfirm=false;render();return}
  if(b.dataset.day){ui.calSel=b.dataset.day;ui.addEvent=false;ui.editEv="";ui.delConfirm=false;render();return}
  if(b.dataset.calnav){const[y,m]=ui.calMonth.split("-").map(Number);const d=new Date(y,m-1+Number(b.dataset.calnav),1);
    ui.calMonth=d.getFullYear()+"-"+pad(d.getMonth()+1);ui.addEvent=false;render();return}
  if(b.dataset.seg==="remDue"){ui.remDue=b.dataset.v;const t=document.getElementById("rem-title").value;render();document.getElementById("rem-title").value=t;return}
  if(b.dataset.seg==="evAllDay"){ui.evAllDay=b.dataset.v==="1";const t=document.getElementById("ev-title").value,d=document.getElementById("ev-date").value,ce=document.getElementById("ev-cal"),c=ce?ce.value:"";render();document.getElementById("ev-title").value=t;document.getElementById("ev-date").value=d;if(c&&document.getElementById("ev-cal"))document.getElementById("ev-cal").value=c;return}
  if(b.dataset.seg){ui[b.dataset.seg]=b.dataset.seg==="qDiff"?Number(b.dataset.v):b.dataset.v;
    b.parentElement.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));return}
  if(b.dataset.del){state.custom=state.custom.filter(c=>c.id!==b.dataset.del);save();render();return}
  if(b.dataset.rdel){state.rewards=state.rewards.filter(r=>r.id!==b.dataset.rdel);save();render();return}
  if(b.dataset.buy){
    const [kind,id]=b.dataset.buy.split(":");
    const r=kind==="wish"?wishQuests().find(x=>x.id===id):state.rewards.find(x=>x.id===id);
    if(!r||state.gold<r.c)return;
    state.gold-=r.c;state.log.unshift({t:"ごほうび購入:"+r.t,xp:0,g:-r.c,ts:Date.now()});state.log=state.log.slice(0,40);
    if(kind==="wish"){boughtWishes.add(id);pushOp({type:"buyWish",id})}
    save();render();
    say([`「${r.t}」を 手に入れた！`,"いまこそ 現実で使うとき。"]);return}
  if(b.dataset.askcos!==undefined){ui.buyConfirm=b.dataset.askcos;render();return}
  if(b.dataset.buycos){const c=COSTUMES.find(x=>x[0]===b.dataset.buycos);if(!c||state.gold<c[2]||state.wardrobe.owned[c[0]])return;
    state.gold-=c[2];state.wardrobe.owned[c[0]]=true;state.wardrobe.wear="c:"+c[0];ui.buyConfirm="";
    state.log.unshift({t:"きせかえ購入:"+c[1],xp:0,g:-c[2],ts:Date.now()});state.log=state.log.slice(0,40);save();render();
    say([`「${c[1]}」を 手に入れた！`,"さっそく 着てみた。"]);return}
  if(b.dataset.wear!==undefined){state.wardrobe.wear=b.dataset.wear;ui.buyConfirm="";save();render();
    say([b.dataset.wear?`「${lookName(b.dataset.wear)}」に 着がえた！`:"階級の姿に もどした。"]);return}
  if(b.dataset.price){ui.priceEdit=b.dataset.price;render();const el=document.getElementById("price-"+b.dataset.price);if(el){el.focus();el.select()}return}
  switch(b.id){
    case"make-wishlist":wishListCreating=true;pushOp({type:"makeWishList"});render();break;
    case"open-pay":ui.addPay=true;render();document.getElementById("pay-title").focus();break;
    case"cancel-pay":ui.addPay=false;render();break;
    case"open-rem":ui.addRem=true;render();document.getElementById("rem-title").focus();break;
    case"cancel-rem":ui.addRem=false;render();break;
    case"open-ev":ui.addEvent=true;ui.editEv="";ui.evAllDay=false;render();document.getElementById("ev-title").focus();break;
    case"cancel-ev":ui.addEvent=false;ui.editEv="";ui.delConfirm=false;render();break;
    case"del-ev":ui.delConfirm=true;render();break;
    case"del-ev-yes":{const e=(MONTH||[]).find(x=>x.k===ui.editEv);if(e){pushOp({type:"deleteEvent",k:e.k});MONTH=MONTH.filter(x=>x!==e);
      if(EVENTS)EVENTS=EVENTS.filter(x=>!(x.id===e.id&&x.start===e.start));say([`予定「${e.title}」を 削除した。`])}
      ui.editEv="";ui.delConfirm=false;render();break}
    case"open-add":ui.addQuest=true;render();document.getElementById("q-title").focus();break;
    case"cancel-add":ui.addQuest=false;render();break;
    case"open-reward":ui.addReward=true;render();document.getElementById("r-title").focus();break;
    case"cancel-reward":ui.addReward=false;render();break;
    case"bk-copy":copyText(BACKUP_PREFIX+b64(JSON.stringify(state)),["バックアップを コピーした！","メモ帳などに 貼り付けておこう。"]);break;
    case"copy-close":ui.copyBox="";render();break;
    case"bk-open":ui.importOpen=true;render();document.getElementById("import-box").focus();break;
    case"bk-cancel":ui.importOpen=false;render();break;
    case"reset-ask":ui.confirmReset=true;render();break;
    case"reset-no":ui.confirmReset=false;render();break;
    case"reset-yes":ui.confirmReset=false;state=fresh();save();tab="quest";render();askName();break;
  }
});
app.addEventListener("submit",e=>{
  e.preventDefault();
  if(e.target.id==="add-form"){
    const t=document.getElementById("q-title").value.trim();if(!t)return;
    state.custom.push({id:uid(),t:t.slice(0,40),s:ui.qStat,d:ui.qDiff,r:ui.qRep,doneOn:"",got:null});
    ui.addQuest=false;save();render();say([`クエスト「${t}」を 受注した！`]);
  }else if(e.target.dataset&&e.target.dataset.priceform){
    const id=e.target.dataset.priceform;const c=Math.max(1,Math.min(99999,parseInt(document.getElementById("price-"+id).value,10)||0));
    const w=(WISHES||[]).find(x=>"w"+hash(String(x.id)).toString(36)===id);
    if(w&&c){w.price=c;w.priced=true;pushOp({type:"setWishPrice",id,price:c})}
    ui.priceEdit="";render();
  }else if(e.target.id==="reward-form"){
    const t=document.getElementById("r-title").value.trim();const c=Math.max(1,Math.min(99999,parseInt(document.getElementById("r-cost").value,10)||0));
    if(!t||!c)return;
    if(IN_WIDGET_APP&&WISHES!==null){
      pushOp({type:"addWish",title:t.slice(0,60),price:c});
      WISHES=WISHES.concat([{id:"pending"+Date.now(),title:t,price:c,priced:true}]);
      ui.addReward=false;render();say([`「${t}」を リストに追加した！`]);
    }else{state.rewards.push({id:uid(),t:t.slice(0,40),c});ui.addReward=false;save();render();}
  }else if(e.target.id==="pay-form"){
    const title=document.getElementById("pay-title").value.trim();if(!title)return;
    const ds=document.getElementById("pay-date").value||today();
    const amount=Math.max(0,parseInt(document.getElementById("pay-amount").value,10)||0);
    const listEl=document.getElementById("pay-list");
    const due=parseYmd(ds).getTime();
    pushOp({type:"addPay",title:title.slice(0,60),due,amount,list:listEl?listEl.value:(PAY_LISTS[0]||"")});
    pendingPays.push({id:"pp"+Date.now(),title,due,amount,list:listEl?listEl.value:(PAY_LISTS[0]||"支払い"),pending:true});
    ui.addPay=false;render();say([`支払い「${title}」を 追加した！`]);
  }else if(e.target.id==="rem-form"){
    const title=document.getElementById("rem-title").value.trim();if(!title)return;
    let due=null,hasTime=false,label="期限なし";
    if(ui.remDue!=="none"){
      let d=parseYmd(today());
      if(ui.remDue==="tomorrow")d.setDate(d.getDate()+1);
      if(ui.remDue==="date"){const v=document.getElementById("rem-date").value;if(v)d=parseYmd(v)}
      const tv=(document.getElementById("rem-time")||{}).value||"";
      if(tv){const[h,m]=tv.split(":").map(Number);d.setHours(h,m,0,0);hasTime=true}
      due=d.getTime();
      label=(d.getMonth()+1)+"/"+d.getDate()+(hasTime?" "+hm(due):"");
    }
    const listEl=document.getElementById("rem-list");
    pushOp({type:"addRem",title:title.slice(0,80),due,hasTime,list:listEl?listEl.value:"",high:ui.remHigh==="1"});
    const lim=parseYmd(today());lim.setDate(lim.getDate()+13);
    const showsHere=due!==null&&ymd(new Date(due))<=ymd(lim);
    if(showsHere)pendingRems.push({title,label});
    ui.addRem=false;render();
    say([`リマインダー「${title}」を 追加した！`,showsHere?"クエストに すぐ並ぶよ。":"期限の2週間前になると クエストに並ぶよ。"]);
  }else if(e.target.id==="ev-form"){
    const title=document.getElementById("ev-title").value.trim();if(!title)return;
    const base=parseYmd(document.getElementById("ev-date").value||ui.calSel);let start,end,allDay=!!ui.evAllDay;
    const calEl=document.getElementById("ev-cal"),cal=calEl?calEl.value:"";if(cal)ui.lastCal=cal;
    if(allDay){start=base.getTime();end=start+864e5}
    else{
      const[sh,sm]=document.getElementById("ev-start").value.split(":").map(Number);
      const[eh,em]=document.getElementById("ev-end").value.split(":").map(Number);
      start=new Date(base.getFullYear(),base.getMonth(),base.getDate(),sh,sm).getTime();
      end=new Date(base.getFullYear(),base.getMonth(),base.getDate(),eh,em).getTime();
      if(end<=start)end+=864e5; // 日をまたぐシフト
    }
    if(ui.editEv){
      const e=(MONTH||[]).find(x=>x.k===ui.editEv);
      if(e){pushOp({type:"editEvent",k:e.k,title:title.slice(0,60),start,end,allDay,cal});
        Object.assign(e,{title,start,end,allDay,cal:cal||e.cal,k:"pending-edit"});say([`予定「${title}」を 変更した！`])}
      ui.editEv="";ui.delConfirm=false;ui.calSel=ymd(base);render();
    }else{
      pushOp({type:"addEvent",title:title.slice(0,60),start,end,allDay,cal});
      pendingEvents.push({id:"p"+Date.now(),title,start,end,allDay,cal,pending:true});
      ui.addEvent=false;ui.calSel=ymd(base);render();say([`予定「${title}」を カレンダーに追加した！`]);
    }
  }else if(e.target.id==="import-form"){
    const raw=document.getElementById("import-box").value.trim();
    try{
      if(!raw.startsWith(BACKUP_PREFIX))throw 0;
      const data=JSON.parse(unb64(raw.slice(BACKUP_PREFIX.length)));
      if(!data||typeof data!=="object"||typeof data.xp!=="number")throw 0;
      state=normalize(data);ui.importOpen=false;save();render();
      say(["冒険の書を 復元した！","おかえりなさい、"+state.name+"。"]);
    }catch(err){say(["復元できませんでした。","「LQSAVE1:」から始まる文字を、まるごと貼り付けてください。"])}
  }else if(e.target.id==="rename-form"){
    state.name=(document.getElementById("rename").value.trim()||"ゆうしゃ").slice(0,12);save();render();say([`なまえを「${state.name}」に変えた。`]);
  }
});
document.querySelector(".tabs").addEventListener("click",e=>{
  const b=e.target.closest(".tab");if(!b)return;tab=b.dataset.tab;
  try{sessionStorage.setItem("lq.tab",tab)}catch(err){}
  ui.addQuest=ui.addReward=ui.confirmReset=ui.importOpen=ui.addEvent=ui.addRem=false;ui.copyBox="";render();window.scrollTo(0,0);
});

/* live clock: countdown every second, full refresh each minute */
let lastMin=-1;
setInterval(()=>{
  const now=new Date();
  const cd=document.getElementById("reset-cd");if(cd)cd.textContent=fmtDur(untilReset(now));
  if(now.getMinutes()!==lastMin){lastMin=now.getMinutes();
    const editing=document.activeElement&&document.activeElement.matches("input,textarea");
    if(!editing)render();}
},1000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)render()});

render();
if(!state.name)askName();
else collectRemsDoneElsewhere();

/* offline support */
if(!IN_WIDGET_APP&&"serviceWorker" in navigator&&location.protocol==="https:"){
  window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{})});
}
})();
